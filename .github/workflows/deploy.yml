name: Deploy

# So no push para a main (o merge de um PR gera esse push)
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # O GHCR exige o nome da imagem em minusculas
      - name: Definir nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medclinic-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: ./clinica
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # As variaveis da aplicacao ficam no painel do Render, nunca aqui
      - name: Disparar deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # ::error:: aparece nas anotacoes do job, sem precisar abrir o log
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Segredo RENDER_DEPLOY_HOOK_URL nao configurado em Settings > Secrets and variables > Actions"
            exit 1
          fi
          if ! curl -fsS -o /dev/null -X POST "$RENDER_DEPLOY_HOOK_URL"; then
            echo "::error::O Render recusou o deploy hook; confira se a URL do segredo RENDER_DEPLOY_HOOK_URL esta correta"
            exit 1
          fi
