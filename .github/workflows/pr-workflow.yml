name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clinica
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinica/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Reprova o job se a cobertura dos services ficar abaixo de 80% (coverageThreshold do Jest)
      - name: Testes com cobertura
        run: npm run test:cov
