services:
  database:
    image: postgres:18-alpine
    container_name: sctec-db
    environment:
      # Valores lidos do clinica/.env (docker compose --env-file clinica/.env ...)
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:-sctec}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/data

volumes:
  pgdata: